org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Note: org.gradle.java.home is intentionally NOT set here. Pinning it to a
# machine-specific JDK path (e.g. Replit's Nix store) breaks the build on any
# other machine, including Android Studio. Replit's own build needs JDK 17
# (the default Java module's JDK 19 fails Android's jlink step) — that pin
# lives in the user-level ~/.gradle/gradle.properties on this Replit
# environment only, not in this committed file. Android Studio should use
# whatever JDK it's configured with (File > Project Structure > SDK Location,
# or a bundled JDK 17+).
